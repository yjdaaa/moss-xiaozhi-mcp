name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,laser,desktop]"
      - run: python -m unittest discover -s tests
      - run: python -m build --wheel
      - run: python -c "import glob, zipfile; wheel = glob.glob('dist/*.whl')[0]; names = zipfile.ZipFile(wheel).namelist(); assert any(name.endswith('apps/laser_web/ui/index.html') for name in names), names"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/excalidraw_lab/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/excalidraw_lab/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  ui-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/excalidraw_lab/ui-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/excalidraw_lab/ui-preview/package-lock.json
      - run: npm ci
      - run: npm test
